<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volleyball Scoring App</title>
  <link rel="stylesheet" href="../assets/css/styles_scoring.css">
</head>
<body>
  <div class="scoreboard">
    <div class="teams-container left" id="teams-container">
      <div class="team" id="team-a">
        <h2>Team A</h2>
        <p id = "name-teamA"></p>
        <div id = "ongoingSetStateTeamA">
          <h2>Points:</h2>
          <p class = "score" id="score-teamA">0</p>
          <button id="increase-score-teamA">+</button>
          <button id="decrease-score-teamA">-</button>
          <p id = "servingstate-teamA">servingstateteamA</p>
        </div>
        <div id = "accruedSetsPointsTeamA">
          <h2>Sets: </h2> 
          <p class = "score" id="sets-teamA">0</p>
          <h2>Points total: </h2> 
          <p class = "score" id="points-teamA">0</p>
        </div>

      </div>
      <div class="team" id="team-b">
        <h2>Team B</h2>
        <p id = "name-teamB"></p>
        <div id = "ongoingSetStateTeamB">
          <h2>Points:</h2>
          <p class = "score" id="score-teamB">0</p>
          <button id="increase-score-teamB">+</button>
          <button id="decrease-score-teamB">-</button>
          <p id = "servingstate-teamB">servingstateteamB</p>
        </div>
        <div id = "accruedSetsPointsTeamB">
          <h2>Sets: </h2> 
          <p class = "score" id="sets-teamB">0</p>
          <h2>Points total: </h2> 
          <p class = "score" id="points-teamB">0</p>
        </div>
      </div>
    </div>
    <div id = "gameInputs" class = "game-inputs">
      <div id = "completeButtons">
        <h2>Game Inputs</h2>
        <button id = "completeGame">Interrupt Game</button>
        <h2></h2>
        <button id = "completeSet">Complete Set</button>
        <h2></h2>
      </div>
      <div id = "teamDetailsInput">
        <button id = "teamNamesInput">Input Team Names</button>
      </div>
      <div id = "homeTeamNameChoice">
        <label id="homeTeamNameForTeamA">
          <input type="radio" name="homeeorawayteamA" value="home" > <span id="servingTeamChoiceTeamAHome">home team name</span>
        </label><br>
        <label id="awayTeamNameForTeamA">
          <input type="radio" name="homeeorawayteamA" value="away" ><span id="servingTeamChoiceTeamAAway">away team name</span> 
        </label><br>
        <button id="nameTeamA">Confirm teamA</button>
      </div>
      <div id = "teamStartingLeftChoice">
        <label id="teamAStartingLeft">
          <input type="radio" name="teamAorBStartingLeft" value="teamA" > <span id="servingTeamChoiceTeamAHome">teamA</span>
        </label><br>
        <label id="teamBStartingLeft">
          <input type="radio" name="teamAorBStartingLeft" value="teamB" ><span id="servingTeamChoiceTeamAAway">teamB</span> 
        </label><br>
        <button id="nameTeamStartingLeft">Confirm team starting Left</button>
      </div>
      <div id = "servingTeamChoice">
        <h2></h2>
        <label id="servingTeamChoiceTeamA">
          <input type="radio" name="team" value="teamA" id="servingTeamChoiceTeamA"> Team A
        </label><br>
        <label id="servingTeamChoiceTeamB">
          <input type="radio" name="team" value="teamB" id="servingTeamChoiceTeamB"> Team B
        </label><br>
        <button id="servingTeam">Confirm serving team</button>
        <h2></h2>
      </div>      
    </div>
    <div class = "game-status">
      <h2>Game Status:</h2>
      <p id = "game-status"></p>
    </div>
  </div>
  <button id="dark-mode-toggle">Toggle Dark Mode</button>
</body>
<script type="module"  src = "../assets/js/current/main_game_scoring.js"></script>
</html>
