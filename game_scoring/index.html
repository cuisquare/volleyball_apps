<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volleyball Scoring App</title>
  <link rel="stylesheet" href="../assets/css/styles_scoring.css">
</head>
<body>
  <div class="scoreboard">
    <div class="teams-container left" id="teams-container">
      <div class="team" id="team-a">
        <h2>Team A</h2>
        <p id = "name-teamA"></p>
        <h2>Points:</h2>
        <p class = "score" id="score-teamA">0</p>
        <button id="increase-score-teamA">+</button>
        <button id="decrease-score-teamA">-</button>
        <p id = "servingstate-teamA">servingstateteamA</p>
        <h2>Sets: </h2> 
        <p class = "score" id="sets-teamA">0</p>
        <h2>Points total: </h2> 
        <p class = "score" id="points-teamA">0</p>
      </div>
      <div class="team" id="team-b">
        <h2>Team B</h2>
        <p id = "name-teamB"></p>
        <h2>Points:</h2>
        <p class = "score" id="score-teamB">0</p>
        <button id="increase-score-teamB">+</button>
        <button id="decrease-score-teamB">-</button>
        <p id = "servingstate-teamB">servingstateteamB</p>
        <h2>Sets: </h2> 
        <p class = "score" id="sets-teamB">0</p>
        <h2>Points total: </h2> 
        <p class = "score" id="points-teamB">0</p>
      </div>
    </div>
    <div class = "game-inputs">
      <h2>Game Inputs</h2>
      <button id = "completeSet">Complete Set</button>
      <h2></h2>
      <label id="servingTeamChoiceTeamA">
        <input type="radio" name="team" value="teamA" id="servingTeamChoiceTeamA"> Team A
      </label><br>
      <label id="servingTeamChoiceTeamB">
        <input type="radio" name="team" value="teamB" id="servingTeamChoiceTeamB"> Team B
      </label><br>
      <button id="servingTeam">Confirm serving team</button>
      <h2></h2>
      <button id = "completeGame">Complete Game</button>
      <h2></h2>
    </div>
    <div class = "game-status">
      <h2>Game Status:</h2>
      <p id = "game-status"></p>
    </div>
  </div>
  <button id="dark-mode-toggle">Toggle Dark Mode</button>
</body>
<script type="module"  src = "../assets/js/main_game_scoring.js"></script>
</html>
